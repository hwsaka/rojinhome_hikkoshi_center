<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日程のご相談｜老人ホーム引越センター福岡</title>
<meta name="description" content="老人ホーム引越センター福岡の日程相談フォーム。カレンダーからご希望日を選んで、LINEで送るだけ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--ink:#1F2A27;--muted:#55625D;--green:#1E5A47;--line:#06C755;--bg:#FAF7F1;--border:#E2D8C6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.7;font-size:16px}
header{background:#fff;border-bottom:1px solid #E7E1D6}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;padding:12px 0}
.logo{width:40px;height:40px;border-radius:10px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.brand b{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:17px;display:block;line-height:1.3}
.brand small{color:var(--muted);font-size:12px}
h1{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:26px;line-height:1.4;margin:28px 0 6px}
.lead{margin:0 0 20px;color:#3B4743}
.card{background:#fff;border:1px solid #E7E1D6;border-radius:20px;padding:20px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#EEF5F1;color:var(--green)}
.req{background:#FDECE6;color:#9A3412}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.row:last-child{margin-bottom:0}
label.lbl{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#FAFAF7;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;min-height:48px}
input:focus,select:focus,textarea:focus{outline:3px solid #BFE3D2;border-color:var(--green)}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--border);background:#FAFAF7;font-weight:500;cursor:pointer}
.chips input:checked+span{background:var(--green);border-color:var(--green);color:#fff}
.chips input:focus-visible+span{outline:3px solid #BFE3D2}
.send{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border:0;border-radius:999px;background:var(--line);color:#0B2414;font:inherit;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
.send:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center}
.err{color:#B42318;font-size:14px;font-weight:700;margin:8px 0 0;min-height:1em}
.preview{white-space:pre-line;background:#F3EEE5;border-radius:12px;padding:12px 14px;font-size:14px;color:#3B4743;margin-top:12px}
.safe{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#2E3B37;background:#EEF5F1;border-radius:12px;padding:10px 12px;margin:16px 0 0}
footer{text-align:center;font-size:13px;color:var(--muted);padding:28px 16px 40px}
footer a{color:var(--green)}
</style>
</head>
<body>
<header>
<div class="wrap brand">
<div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></div>
<div><b>老人ホーム引越センター福岡</b><small>運営：HW株式会社（福岡県糸島市）</small></div>
</div>
</header>

<main class="wrap">
<h1>引越し日程のご相談</h1>
<p class="lead">カレンダーからご希望日を選んで「LINEで送る」を押してください。LINEのトークに内容が入りますので、そのまま送信するだけです。</p>

<form id="f" novalidate>
<div class="card">
<h2>ご相談の内容 <span class="badge req">必須</span></h2>
<div class="chips" role="radiogroup" aria-label="ご相談の内容">
<label><input type="radio" name="kind" value="施設への入居" checked><span>施設への入居</span></label>
<label><input type="radio" name="kind" value="施設からの退去"><span>施設からの退去</span></label>
<label><input type="radio" name="kind" value="ご逝去に伴う退去"><span>ご逝去に伴う退去</span></label>
</div>
</div>

<div class="card">
<h2>ご希望日</h2>
<div class="row">
<div><label class="lbl" for="d1">第1希望 <span class="badge req">必須</span></label><input type="date" id="d1" required></div>
<div><label class="lbl" for="t1">時間帯</label><select id="t1"><option>指定なし</option><option>午前</option><option>午後</option></select></div>
</div>
<div class="row">
<div><label class="lbl" for="d2">第2希望</label><input type="date" id="d2"></div>
<div><label class="lbl" for="t2">時間帯</label><select id="t2"><option>指定なし</option><option>午前</option><option>午後</option></select></div>
</div>
<div class="row">
<div><label class="lbl" for="d3">第3希望</label><input type="date" id="d3"></div>
<div><label class="lbl" for="t3">時間帯</label><select id="t3"><option>指定なし</option><option>午前</option><option>午後</option></select></div>
</div>
</div>

<div class="card">
<h2>わかる範囲で</h2>
<label class="lbl" for="fac">施設名（入居先・退去元）</label>
<input type="text" id="fac" placeholder="例）〇〇ケアホーム糸島" autocomplete="off">
<div style="height:12px"></div>
<label class="lbl" for="memo">ご質問・ご要望</label>
<textarea id="memo" placeholder="例）介護ベッドあり、2階のお部屋です"></textarea>
</div>

<button type="submit" class="send" id="send">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5c0 4.1-4 7.5-9 7.5-1 0-2-.1-2.9-.4L5 20l1.2-3.3C4.2 15.3 3 13.5 3 11.5 3 7.4 7 4 12 4s9 3.4 9 7.5z"/></svg>
LINEで送る
</button>
<p class="err" id="err" role="alert"></p>
<div class="preview" id="pv" aria-live="polite"></div>
<p class="note">送信ボタンを押すまで、内容は送られません。</p>
<div class="safe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E5A47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg><span>このページに入力した内容は、どこにも保存されません。LINEのトークでお送りいただいた内容だけを、日程のご相談に使います。</span></div>
</form>
</main>

<footer>
お電話でのご相談：<a href="tel:08036196004">080-3619-6004</a><br>
<a href="./">老人ホーム引越センター福岡 トップへ</a>
</footer>

<script>
(function(){
  var LINE_ID='%40201xuexr';
  var W=['日','月','火','水','木','金','土'];
  function pad(n){return (n<10?'0':'')+n}
  var t=new Date(); t.setDate(t.getDate()+1);
  var min=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  ['d1','d2','d3'].forEach(function(id){document.getElementById(id).min=min});
  function fmt(v){
    if(!v) return '';
    var p=v.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
    return (+p[1])+'月'+(+p[2])+'日（'+W[d.getDay()]+'）';
  }
  function build(){
    var kind=document.querySelector('input[name=kind]:checked').value;
    var lines=['【日程のご相談】','内容：'+kind];
    for(var i=1;i<=3;i++){
      var d=document.getElementById('d'+i).value;
      if(!d) continue;
      var tm=document.getElementById('t'+i).value;
      lines.push('第'+i+'希望：'+fmt(d)+(tm==='指定なし'?'':' '+tm));
    }
    var fac=document.getElementById('fac').value.trim();
    if(fac) lines.push('施設名：'+fac);
    var memo=document.getElementById('memo').value.trim();
    if(memo) lines.push('ご要望：'+memo);
    return lines.join('\n');
  }
  function refresh(){
    var ok=!!document.getElementById('d1').value;
    document.getElementById('pv').textContent=ok?build():'第1希望日を選ぶと、送る内容がここに表示されます。';
    if(ok) document.getElementById('err').textContent='';
  }
  document.getElementById('f').addEventListener('input',refresh);
  document.getElementById('f').addEventListener('change',refresh);
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    if(!document.getElementById('d1').value){
      document.getElementById('err').textContent='第1希望日を選んでください。';
      document.getElementById('d1').focus();
      return;
    }
    location.href='https://line.me/R/oaMessage/'+LINE_ID+'/?'+encodeURIComponent(build());
  });
  refresh();
})();
</script>
</body>
</html>
